<body onload="currentUserName()">

<div class = "news-wrapper">

    <div class="newsManageGrid">
        <div class="navbarWindow">
            <nav class="mainNavbar navbar fixed-top navbar-expand-sm shadow-sm" id="navigationBar">
            </nav>
        </div>

    <div id="mobileNavigationBar"></div>

    <div class="newsManageTitle">
        <label class="form-label fw-bold">News management</label>
    </div>

        <div class="newsManagePanel shadow rounded-2" style="margin-bottom: 20px">
            <form onsubmit="">
                <div class="news-add-article-title">
                    <label class="form-label fw-bold" id="pageTitle">Add news article</label>
                </div>

                <label for="titleLabel" class="form-label">News title</label><br>
                <input class="labelFit form-control" id="titleLabel" type="text" maxlength="100" placeholder="An interesting title..." required/>
                <div id="projectTitleHelp" class="form-text">
                    Max. 100 characters
                </div>
                <br>

                <label for="descriptionLabel" class="form-label">News description</label><br>
                <textarea rows="5" style="resize: none;" class="descriptionField form-control" id="descriptionLabel" type="text" maxlength="1000" required></textarea>
                <div id="projectDescriptionHelp" class="form-text">
                    Max. 1000 characters
                </div>
                <br>

                <label for="imageUpload" class="form-label">Image upload</label>
                <input class="form-control" type="file" id="imageUpload" accept=".png,.jpg,.jpeg">
                <div id="imageUploadHelp" class="form-text">
                    Only one png, jpeg or jpg file
                </div><br><br>

                <div class="d-grid gap-2">
                    <button class="btn btn-voice shadow-sm" type="submit" id="submitButton" onclick="publishNews()">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <div class = "news-overview shadow">
        <div class = "news-overview-title fw-bold">News overview</div>
        <br> <table class="table"  style="text-align: center">
        <thead>
        <tr>
            <th scope="col">Number</th>
            <th scope="col">News title</th>
            <th scope="col">Modify</th>
        </tr>
        </thead>
        <tbody id = "listListNews">
            <script> loopAllNewsManagement() </script>
        </ul>
        </tbody>
    </table>
