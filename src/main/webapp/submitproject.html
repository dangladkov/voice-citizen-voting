<script src="webjars/leaflet/1.8.0/leaflet.js"></script>
<script>
  var map = L.map('map').setView([52.24042172144043, 6.849487143134112], 16);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  var markerList = L.layerGroup().addTo(map);


  function setMarker() {
    var inputAddress = document.getElementById('locationInput').value;
    if (inputAddress) {
      // Use Geocoding API to get the coordinates from the address
      var geocodingUrl = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(inputAddress);
      fetch(geocodingUrl)
              .then(function(response) {
                return response.json();
              })
              .then(function(data) {
                if (data.length > 0) {
                  var lat = parseFloat(data[0].lat);
                  var lon = parseFloat(data[0].lon);
                  // Clear the existing markers on the map
                  markerList.clearLayers();
                  // Add marker on coordinates
                  var marker = L.marker([lat, lon]).addTo(markerList);
                  // Navigate to the point on the map
                  map.setView([lat, lon], 13);
                } else {
                  $(".warningAlertLocation").fadeIn();
                  setTimeout(function(){
                    $(".warningAlertLocation").fadeOut();
                  }, 1500);
                }
              })
              .catch(function(error) {
                console.log('Error:', error);
                $(".warningAlertGeocoding").fadeIn();
                setTimeout(function(){
                  $(".warningAlertGeocoding").fadeOut();
                }, 1500);
              });
    }
  }

  document.getElementById('locationButton').addEventListener('click', setMarker);

</script>
