    <head>
        <meta charset="UTF-8">
        <title>Voice Platform</title>

        <link rel="stylesheet" href="webjars/bootstrap/5.2.3/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/leaderboard.css">

        <script>$(function(){
            $("#navigationBar").load("navigationpanel.html")
            $("#mobileNavigationBar").load("mobilenavigationpanel.html")

    <body onload="currentUserName(); getLeaderboard()">
        <div class="leadPage">
            <div class="navbarWindow">
                <nav class="mainNavbar navbar fixed-top navbar-expand-sm shadow-sm" id="navigationBar">
                </nav>
            </div>

            <div id="mobileNavigationBar"></div>

            <div class="leadWindow rounded-4 shadow p-3 mb-5 bg-body-tertiary rounded">

                    </div>

                    <!--User 1 row-->
                    <div class="goldIcon table-group-divider table-primary">

                    <div class="user1Score table-group-divider table-primary">

                    <div class="silverIcon">

                    </div>

                    </div>
                    <div class="user2Score">
                        <label class="form-label" id="scoreLabelUser2">1100</label>
                    </div>

                    <!--User 3 row-->
                    <div class="bronzeIcon">
                        <span class="circleIcon" style="background-color: chocolate"></span>
                    </div>

                    </div>
                    <div class="user3Score">
                        <label class="form-label" id="scoreLabelUser3">1093</label>
                    </div>

                    <!--User 4 row-->

                    </div>
                    <div class="user4Score">
                        <label class="form-label" id="scoreLabelUser4">score</label>
                    </div>

                    <!--User 5 row-->
                    <div class="user5">
                        <label class="form-label" id="person5nameLabel">Person Five</label>
                    </div>
                    <div class="user5Score">
                        <label class="form-label" id="scoreLabelUser5">score</label>
                    </div>

                    <!--User 6 row-->
                    <div class="user6">
                        <label class="form-label" id="person6nameLabel">Person Six</label>
                    </div>
                    <div class="user6Score">
                        <label class="form-label" id="scoreLabelUser6">score</label>
                    </div>

                    <!--User 7 row-->
                    <div class="user7">
                        <label class="form-label" id="person7nameLabel">Person Seven</label>
                    </div>
                    <div class="user7Score">

                    </div>

                    <!--User 8 row-->
                    <div class="user8">

                    </div>
                    <div class="user8Score">

                    </div>

                    <!--User 9 row-->
                    <div class="user9">
                        <label class="form-label" id="person9nameLabel">Person Nine</label>
                    </div>
                    <div class="user9Score">
                        <label class="form-label" id="scoreLabelUser9">score</label>
                    </div>

                    <!--User 10 row-->
                    <div class="user10">

                    </div>
                    <div class="user10Score">
                        <label class="form-label" id="scoreLabelUser10">score</label>
                    </div>

                    <!--Current user row-->
                    <div class="thisUserBackground rounded-pill shadow-sm" style="background-color: #ffd0a0" ></div>
                    <div class="thisUserIcon"></div>
                    <div class="thisUser">
                        <label class="form-label fw-bold" id="currentUserNameLabel">K</label>
                    </div>
                    <div class="thisUserScore">
